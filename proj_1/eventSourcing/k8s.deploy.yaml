# discoverserver Deployment và Service
apiVersion: apps/v1
kind: Deployment
metadata:
    name: discoverserver
spec:
    replicas: 1
    selector:
        matchLabels:
            app: discoverserver
    template:
        metadata:
            labels:
                app: discoverserver
        spec:
            containers:
                - name: discoverserver
                  image: microservice-eventsourcing-discoverserver
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
    name: discoverserver
spec:
    selector:
        app: discoverserver
    ports:
        - protocol: TCP
          port: 8761
          targetPort: 8761
    type: NodePort

---
# Apigateway Deployment và Service
apiVersion: apps/v1
kind: Deployment
metadata:
    name: apigateway
spec:
    replicas: 1
    selector:
        matchLabels:
            app: apigateway
    template:
        metadata:
            labels:
                app: apigateway
        spec:
            containers:
                - name: apigateway
                  image: microservice-eventsourcing-apigateway
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
    name: apigateway
spec:
    selector:
        app: apigateway
    ports:
        - protocol: TCP
          port: 8080
          targetPort: 8080
    type: NodePort