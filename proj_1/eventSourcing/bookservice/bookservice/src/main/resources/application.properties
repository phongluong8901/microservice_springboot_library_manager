spring.application.name=bookservice

server.port = 9001
eureka.client.service-url.defaultZone = http://localhost:8761/eureka

logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.tool.schema=DEBUG

spring.datasource.url=jdbc:h2:mem:bookDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Thêm dòng này để sửa lỗi "webAllowOthers is disabled" của H2 Console
spring.h2.console.settings.web-allow-others=true

# Cấu hình chuẩn ddl-auto cho Spring Boot 3 / Hibernate 6
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Bật log SQL để xem nó có thực thi lệnh tạo bảng không
spring.jpa.show-sql=true

